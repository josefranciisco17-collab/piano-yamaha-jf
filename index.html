<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Piano Yamaha Sample Player</title>
<style>
body{margin:0;padding:15px;background:#121212;color:#fff;font-family:Segoe UI;text-align:center}
.controls{margin:10px}
button{padding:10px 16px;border-radius:20px;background:#1f1f1f;color:#fff;border:1px solid #444;cursor:pointer}
.piano-container{overflow-x:auto;background:#0a0a0a;padding:10px;border-radius:8px}
.piano-keyboard{display:flex;position:relative;width:max-content}
/* Regresamos a tus estilos de borde originales exactos para que el Flexbox no rompa el diseño */
.key{width:38px;height:210px;background:linear-gradient(#ffffff,#f0f0f0,#dcdcdc);border-left:2px solid #000;border-right:2px solid #000;border-bottom:2px solid #000;position:relative;box-shadow:inset 0 0 8px rgba(255,255,255,.8)}
.key.active{transform:translateY(2px);background:#d0d0d0}
.black{position:absolute;width:24px;height:130px;background:#111;z-index:2;margin-left:-12px}
.label{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:8px}
</style>
</head>
<body>
<h2>Piano Yamaha</h2><div style='margin-top:-8px;margin-bottom:10px;font-size:14px;color:#d0d0d0'>By José Francisco A.M</div>

<div class="controls"><button id="pedal">Sustain OFF</button></div>
<div class="piano-container"><div class="piano-keyboard" id="keyboard"></div></div>

<script>
const AudioContextClass=window.AudioContext||window.webkitAudioContext;
let audioCtx;
let sustain=false;
const cache={};

function initAudio(){ if(!audioCtx) audioCtx=new AudioContextClass(); }

document.getElementById("pedal").onclick=()=>{
sustain=!sustain;
document.getElementById("pedal").textContent="Sustain "+(sustain?"ON":"OFF");
};

const SAMPLE_NOTES=[
"A0","C1","Ds1","Fs1","A1","C2","Ds2","Fs2","A2",
"C3","Ds3","Fs3","A3","C4","Ds4","Fs4","A4",
"C5","Ds5","Fs5","A5","C6","Ds6","Fs6","A6",
"C7","Ds7","Fs7","A7","C8"
];

function noteToMidi(name){
const map={C:0,Cs:1,D:2,Ds:3,E:4,F:5,Fs:6,G:7,Gs:8,A:9,As:10,B:11};
const m=name.match(/^([A-G]s?)(\d)$`/);
return (parseInt(m[2])+1)*12+map[m[1]];
}

function getBestSample(noteId){
const midi=noteId+21;
let best=SAMPLE_NOTES[0], diff=999;
for(const s of SAMPLE_NOTES){
const d=Math.abs(midi-noteToMidi(s));
if(d<diff){diff=d;best=s;}
}
const semitones=midi-noteToMidi(best);
return {file:audio/${best}v8.mp3`,rate:Math.pow(2,semitones/12)};
}

async function loadSample(file){
if(cache[file]) return cache[file];
const r=await fetch(file);
const b=await r.arrayBuffer();
const a=await audioCtx.decodeAudioData(b);
cache[file]=a;
return a;
}

async function playNote(noteId){
initAudio();
const s=getBestSample(noteId);
const buffer=await loadSample(s.file);

const src=audioCtx.createBufferSource();
src.buffer=buffer;
src.playbackRate.value=s.rate;

const gain=audioCtx.createGain();
gain.gain.value=1.0;

src.connect(gain);
gain.connect(audioCtx.destination);

src.start();

if(!sustain){
gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
src.stop(audioCtx.currentTime + 1.6);
}
}

const names=["Do","Do#","Re","Re#","Mi","Fa","Fa#","Sol","Sol#","La","La#","Si"];
const keyboard=document.getElementById("keyboard");
let white=0;

for(let i=0;i<88;i++){
const note=(i+9)%12;
const oct=Math.floor((i+9)/12);
const black=names[note].includes("#");

const key=document.createElement("div");
key.className="key"+(black?" black":"");
key.dataset.note=i;

const label=document.createElement("span");
label.className="label";
label.textContent=names[note]+oct;
key.appendChild(label);

/* CORRECCIÓN MATEMÁTICA EXACTA:
Multiplicamos las blancas acumuladas por 38px de su ancho físico.
Como mantuvimos tus estilos originales completos, tu CSS tiene un 'margin-left: -12px' en las negras.
Sumando los 2px extra del borde izquierdo que se acumulan por cada tecla blanca, la fórmula compensa
exactamente la posición para que caiga al centro perfecto de la separación.
*/
if(black) key.style.left=((white * 38) + (white * 2)) + "px";
else white++;

key.addEventListener("pointerdown", async ()=>{
key.classList.add("active");
playNote(i);
setTimeout(()=>key.classList.remove("active"),120);
});

keyboard.appendChild(key);
}
</script>
</body>
</html>
